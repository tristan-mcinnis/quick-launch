name: CI

# Publish scrub, then the SwiftPM test suite, on every push and pull request.
# The scrub reads an optional untracked .scrub-private; on CI it is absent, so
# only the public patterns run.

# Doc-only changes skip CI. Keep this list the same as is_docs_path in
# scripts/git-hooks/pre-push. CLAUDE.md and AGENTS.md stay out of it:
# AIChatWindowTests reads the contract in them.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'scripts/git-hooks/README.md'
      - 'Packaging/Release/highlights.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'scripts/git-hooks/README.md'
      - 'Packaging/Release/highlights.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Scrub and swift test
    # Apple Silicon hosted runner. The macos-26 image ships Xcode 26.x
    # (default 26.6 at /Applications/Xcode_26.6.app), which has Swift 6.2+ and
    # the macOS 26 SDK. Source:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so ci-pin-mtimes.py can stamp each file with its
          # last commit time (the clone is under 10 MB).
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select -s "$XCODE"
          xcode-select -p
          xcodebuild -version
          swift --version
          echo "SWIFT_VERSION=$(swift --version 2>&1 | head -n 1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      # A cold build is most of the run. Two things make a cached .build
      # usable. (1) A fresh checkout stamps every file with the clone time, so
      # every source looks changed: pin each file to its last commit time.
      # (2) actions/cache archives with GNU tar, which keeps whole-second
      # mtimes, and SwiftPM then rebuilds everything it restored. So .build
      # travels as a tarball made by macOS tar, which keeps nanoseconds.
      - name: Pin source mtimes to commit times
        run: python3 scripts/ci-pin-mtimes.py

      - name: Restore SwiftPM build
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: .build-cache.tar
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved') }}-
            spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-

      - name: Unpack SwiftPM build
        if: steps.build-cache.outputs.cache-matched-key != ''
        run: /usr/bin/tar -xpf .build-cache.tar && rm .build-cache.tar

      - name: Publish scrub
        run: sh scripts/scrub.sh

      - name: Test
        id: test
        run: swift test

      # Saved after a failed test too: the build itself is still good.
      - name: Pack SwiftPM build
        if: always() && steps.test.outcome != 'skipped' && steps.build-cache.outputs.cache-hit != 'true'
        run: /usr/bin/tar -cf .build-cache.tar .build

      - name: Save SwiftPM build
        if: always() && steps.test.outcome != 'skipped' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .build-cache.tar
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
