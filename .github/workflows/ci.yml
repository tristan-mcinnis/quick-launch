name: CI

# Publish scrub, then the SwiftPM test suite, on every push and pull request.
# The scrub reads an optional untracked .scrub-private; on CI it is absent, so
# only the public patterns run.

# Doc-only changes skip CI. Keep this list the same as is_docs_path in
# scripts/git-hooks/pre-push. CLAUDE.md and AGENTS.md stay out of it:
# AIChatWindowTests reads the contract in them.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'scripts/git-hooks/README.md'
      - 'Packaging/Release/highlights.md'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
      - 'scripts/git-hooks/README.md'
      - 'Packaging/Release/highlights.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Scrub and swift test
    # Apple Silicon hosted runner. The macos-26 image ships Xcode 26.x
    # (default 26.6 at /Applications/Xcode_26.6.app), which has Swift 6.2+ and
    # the macOS 26 SDK. Source:
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=/Applications/Xcode_26.6.app
          if [ ! -d "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          fi
          sudo xcode-select -s "$XCODE"
          xcode-select -p
          xcodebuild -version
          swift --version
          echo "SWIFT_VERSION=$(swift --version 2>&1 | head -n 1 | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      # A cold build is ~6 of the ~7 minutes. Cache SwiftPM's .build keyed on
      # the toolchain and the resolved packages; a source change still
      # restores the closest cache and rebuilds only what changed.
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-${{ hashFiles('Package.resolved', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}-
            spm-${{ runner.os }}-${{ runner.arch }}-${{ env.SWIFT_VERSION }}-

      - name: Publish scrub
        run: sh scripts/scrub.sh

      - name: Test
        run: swift test
